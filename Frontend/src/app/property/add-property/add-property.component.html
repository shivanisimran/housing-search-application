<div class="row mb-5">
  <div class="col-8 shadow-lg p-0 bg-white">

    <div class="card">
      <div class="card-header">
        <h3>List your Property</h3>
      </div>
      <div class="card-body">
      <form (ngSubmit)='onSubmit()' #Form="ngForm">
        <div class="tab-panel">
          <tabset class="member-tabset" #formTabs>
            <tab heading="Basic info" ngModelGroup="basicInfo" #basicInfo="ngModelGroup">
              <div class="form-group col-12">
                <p>I want to</p>
                <div class="btn-group" btnRadioGroup ngModel name="SellRent" required>
                  <label class="btn btn-outline-primary me-2" 
                  btnRadio=1 tabindex="0" role="button" name="SellRent">Sell</label>

                  <label class="btn btn-outline-primary" 
                  btnRadio=2 tabindex="0" role="button" name="SellRent">Rent</label>
                </div> 
              </div>

              <div class="form-group col-12 mt-3">
                <p>BHK</p>
                <div class="btn-group" btnRadioGroup
                [(ngModel)]="propertyView.BHK" name="BHK">
                  <label 
                  *ngFor="let bhk of [1,2,3,4,5]"
                  class="btn btn-outline-primary me-2" 
                  [btnRadio]="bhk" tabindex="0" role="button">{{ bhk }}</label>
                </div> 
              </div>

              <div class="form-group col-12 mt-3">
                <p>Property Type</p>
                <div class="btn-group" btnRadioGroup name ="propertyType"
                   [(ngModel)]="propertyView.PType">

                  <label 
                  *ngFor="let ptype of propertyTypes"
                  class="btn btn-outline-primary me-2" 
                  [btnRadio]="ptype" tabindex="0" role="button">{{ ptype }}</label>

                </div> 
              </div>

              <div class="form-group col-12 mt-3">
                <p>Furnish Type</p>
                <div class="btn-group" btnRadioGroup
                [(ngModel)]="propertyView.FType" name="FType">
                  <label 
                  *ngFor="let ftype of furnishTypes"
                  class="btn btn-outline-primary me-2" 
                  [btnRadio]="ftype" tabindex="0" role="button">{{ ftype }}</label>

                </div> 
              </div>
                  

                <div class="form-group col-12 mt-3">
                <label for="name" class="mb-2">in Building/Society/Project</label>
                <input
                 name="name" 
                 type="text" 
                 class="form-control" 
                 #propName="ngModel" 
                 [(ngModel)]="propertyView.Name"
                 required 
                 minlength="5">
                <span *ngIf="propName.invalid && propName.touched" class="error-block">  
                  <span *ngIf="propName.hasError('required')">Please enter a name for the property.</span>
                  <span *ngIf="propName.hasError('minlength')">Name must be at least 5 characters long.</span>
                </span>
              
              </div>

              <div class="form-group col-12 mt-3">
                <label for="type" class="mb-2">City</label>
                <input name="city" type="text" class="form-control" [(ngModel)]="propertyView.City">
              </div>

              <div class="form-group col-12 mt-3">
                <label for="price" class="mb-2">Price</label>
                <input name="price" type="number" class="form-control" [(ngModel)]="propertyView.Price">
              </div>

              <div class="form-group col-12 mt-3">
                <button [disabled]="!basicInfo.valid" type="button" class="btn btn-primary w-100" (click)="selectTab(1)">Next</button>
              </div>
            </tab>
            <tab heading="Pricing and Area">
              <div class="form-group col-12">
                  <label class="mb-2">Price (in USD)</label>
                <input type="number" class="form-control" name="PriceDetails" [(ngModel)]="propertyView.Price">
                </div>

                <div class="form-group col-12">
                  <label class="mb-2">Security (in USD)</label>
                  <input type="text" class="form-control">
                </div>

                <div class="form-group col-12">
                  <label class="mb-2">Maintenance (in USD)</label>
                  <input type="text" class="form-control">
                </div>

                <div class="form-group col-12">
                  <label class="mb-2">Built Area (in Sqr Feet)</label>
                  <input type="number" class="form-control" name="BuiltArea" [(ngModel)]="propertyView.BuiltArea">
                </div>

                <div class="form-group col-12">
                  <label class="mb-2">Carpet Area(in Sqr Feet)</label>
                  <input type="text" class="form-control">
                </div>


              <div class="form-group col-12 mt-3">
                <button type="button" class="btn btn-primary w-100 mb-2" (click)="selectTab(2)">Next</button>
                <button type="button" class="btn btn-primary w-100" (click)="selectTab(0)">Back</button>
              </div>
            </tab>


            <tab heading="Address">
              <div class="form-group col-12">
                <label class="mb-2">Floor</label>
                <input type="text" class="form-control">
              </div>

              <div class="form-group col-12">
                <label class="mb-2">Total Floor</label>
                <input type="text" class="form-control">
              </div>

              <div class="form-group col-12">
                <label class="mb-2">Address</label>
                <input type="text" class="form-control">
              </div>

              <div class="form-group col-12">
                <label class="mb-2">Landmark</label>
                <input type="text" class="form-control">
              </div>

              <div class="form-group col-12 mt-3">
                <button type="button" class="btn btn-primary w-100 mb-2" (click)="selectTab(3)">Next</button>
                <button type="button" class="btn btn-primary w-100" (click)="selectTab(1)">Back</button>
              </div>
            </tab>


            <tab heading="Other Details">
                <div class="form-group col-12">
                <label class="mb-2">Ready to Move</label><br/>
                <input type="radio" id='Yes' value='1' name="RTM">
                <label class="m-2">Yes</label>

                <input type="radio" id="No" value='2' name="RTM">
                <label class="m-2">No</label>
              </div>

              <div class="form-group col-3 mt-3">
                <label class="d-block mb-2">Possession/Avaialble From</label>
                <input type="text"
                placeholder="Datepicker"
                class="form-control"
                bsDatepicker [bsConfig]="{containerClass: 'theme-dark-blue', dateInputFormat: 'DD-MM-YYYY'} ">
              </div>

              <div class="form-group col-12 mt-3">
                <label class="d-block mb-2">Age of Property</label>
                <input type="text" class="form-control">
              </div>
              
              <div class="form-group col-12 mt-3">
                <p>Gated Community</p>
                <div class="btn-group" btnRadioGroup>
                  <label
                  *ngFor="let gatedCommunity of ['Yes', 'No']"
                  class="btn btn-outline-primary me-2" 
                  btnRadio="gatedCommunity" tabindex="0" role="button" name="SellRent">{{ gatedCommunity }} </label>
                </div> 
              </div>
            

              <div class="form-group col-12 mt-3">
                <p>Ready to move</p>
                <div class="btn-group" btnRadioGroup>
                  <label
                  *ngFor="let readyToMove of ['East', 'West', 'North', 'South']"  
                  class="btn btn-outline-primary me-2" 
                  btnRadio="readyToMove" tabindex="0" role="button" name="SellRent">{{ readyToMove }} </label>
                </div> 
              </div>

              <div class="form-group col-12 mt-3">
                <label class="mb-2">Description</label>
                <textarea type="text" class="form-control" rows="6"></textarea>
              </div>

              <div class="form-group col-12 mt-3">
                <button type="button" class="btn btn-primary w-100 mb-2" (click)="selectTab(4)">Next</button>
                <button type="button" class="btn btn-primary w-100" (click)="selectTab(2)">Back</button>
              </div>
            </tab>

            <tab heading="Photos">
              <div class="form-group col-12">
                <div class="photo-control">
                    <button class="mt-5" type="button">Upload</button> <br>
                    This is under construction
                </div>
              </div>
              <div class="form-group col-12 mt-3">
                  <button type="button" class="btn btn-primary w-100" (click)="selectTab(3)">Back</button>
 
                  <button type="submit" class="btn btn-primary w-100 mt-2">Save</button>
                  <button type="button" class="btn btn-primary w-100 mt-2">Cancel</button>     
              </div>
            </tab>
          </tabset>
        </div>
        
      </form>

      </div>
    </div>
  </div>

  <div class="col-4">
    <div class="card-header">
      <h3>Your Property Preview</h3>
    </div>
    <div class="shadow-lg p-3 bg-white">
      <app-property-card
        [prop_list]="[propertyView]"
        [previewName]="propertyView.Name"
        [previewType]="propertyView.PType"
        [previewPrice]="propertyView.Price"
        [previewBHK]="propertyView.BHK"
        [previewFType]="propertyView.FType"
        [previewBuiltArea]="propertyView.BuiltArea"
        [previewCity]="propertyView.City"
        [hideIcons]="true">
      </app-property-card>
    </div>

  </div>

</div>
