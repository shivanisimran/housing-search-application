<div class="card">
  <div class="card-header">
    <h1>Add New Property</h1>
  </div>
  <div class="card-body">
    <form (ngSubmit)='onSubmit()' #Form="ngForm">
      <div class="form-group col-12">
        <label for="name">Name</label>
        <input name="name" type="text" class="form-control" #propName="ngModel" ngModel name="Name" required 
        minlength="5">
        <span *ngIf="propName.invalid && propName.touched" class="error-block">  
           <span *ngIf="propName.hasError('required')">Please enter a name for the property.</span>
           <span *ngIf="propName.hasError('minlength')">Name must be at least 5 characters long.</span>
        </span>
       
      </div>

      <div class="form-group col-12 mt-3">
        <label for="type">Type</label>
        <input name="type" type="text" class="form-control" ngModel name="Type">
      </div>

      <div class="form-group col-12 mt-3">
        <label for="price">Price</label>
        <input name="price" type="text" class="form-control" ngModel name="Price">
      </div>

      <div class="form-group col-12 mt-3">
        <button [disabled]="!Form.valid" type="submit" class="btn btn-primary me-2">Save</button>
        <button type="reset" class="btn btn-primary">Cancel</button>
      </div>
    </form>

  </div>

</div>
