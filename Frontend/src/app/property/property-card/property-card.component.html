<div class="card">
    <div class="card-img-wrappper">   
        <img *ngIf="prop_list[0].Image" class="card-img-top" src="assets/images/{{prop_list[0].Image}}.png">
        <img *ngIf="!prop_list[0].Image" class="card-img-top" src="assets/images/house_default.png">
        <ul class="list-inline text-center member-icons animate">    
            <li class="list-inline-item">
                <button class="btn btn-primary" routerLink="/property-detail/{{prop_list[0].Id}}"><i class="far fa-edit"></i></button>
            </li>
            <li class="list-inline-item">
                <button class="btn btn-primary"><i class="far fa-address-book"></i></button>
            </li>
        </ul>
    </div>
    <div class="card-body p-2">
        <h1>{{prop_list[0].Name}}</h1>
        <h1>{{prop_list[0].Type}}</h1>
        <h2>{{prop_list[0].Price}}</h2>
    </div> 
</div>
