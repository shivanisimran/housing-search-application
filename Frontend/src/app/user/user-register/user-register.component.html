<div class="row">
  <div class="col-6 m-auto">
  <div class="card m-auto">
    <div class="card-header">
      Register
    </div>
    <div class="card-body">
      <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
        <div class="form-group col-12">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" 
            formControlName="username">

            <span *ngIf="!userName?.valid && (userName?.touched || userSubmitted)"  
             class="error-block">
                   Please provide name

            </span>
        </div>

        <div class="form-group col-12 mt-3">
          <label for="email" class="form-label">Email</label>
          <input type="text" class="form-control" formControlName="email">

          <span *ngIf="!email?.valid && (email?.touched || userSubmitted)" class="error-block" >
             <span *ngIf="email.hasError('required')">
              Email is required</span>
             <span *ngIf="email.hasError('email')">
              Please provide a valid email</span>
          </span>
        </div>

        <div class="form-group col-12 mt-3">
          <label for="password" class="form-label">Password</label>
          <input type="text" class="form-control" formControlName="password">

          <span *ngIf="!password?.valid && (password?.touched || userSubmitted)" class="error-block" >
             <span *ngIf="password.hasError('required')">
              Password is required </span>
             <span *ngIf="password.hasError('minlength')">
              Password must be at least 8 characters long </span>
          </span>
        </div>

        <div class="form-group col-12 mt-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="text" class="form-control" formControlName="confirmPassword">
          <span *ngIf="!confirmPassword?.valid && (confirmPassword?.touched || userSubmitted)" class="error-block" >
             <span *ngIf="confirmPassword.hasError('required')">
              Please confirm Password </span>
          </span>
            <span *ngIf="registrationForm.hasError('mismatch') && confirmPassword.valid" class="error-block" >
              Passwords do not match </span>
        </div>

        <div class="form-group col-12 mt-3">
          <label for="mobile" class="form-label">Mobile</label>
          <input type="text" class="form-control" formControlName="mobile">

          <span *ngIf="!mobile?.valid && (mobile?.touched || userSubmitted)" class="error-block" >
             <span *ngIf="mobile.hasError('required')">
              Mobile is required </span>
             <span *ngIf="mobile.hasError('pattern')">
              Please provide mobile </span>
          </span>
        </div>

        <div class="form-group col-12 mt-3">
          <button type="submit" class="btn btn-primary me-2">Save</button>
          <button type="reset" class="btn btn-secondary ml-2">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  </div>
</div>
